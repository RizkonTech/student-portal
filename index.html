<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Student Form</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <form>
            <header>
                <h1>COLCOMPS Registration form</h1>
                <h3>Please fill in the information below</h3>
            </header>

            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">full name</label>
                <input type="text" id="name" name="name" placeholder="surname first" required>
                <br><br>
                <label for="email">Student Email</label>
                <input type="email" id="email" name="email" placeholder="Student Email" required>
                <br><br>
                <label for="number">Phone number</label>
                <input type="number" id="tel" name="number" placeholder="Phone number" required>
                <br><br>

                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Academic Information</legend>

                <label>Matric number</label>
                <input type="number" placeholder="Matric number" required>
                <br><br>
                <label>College</label>
                <input type="text" placeholder="College" required>
                <br><br>
                <label>Program</label>
                <input type="text" placeholder="Program" required>
                <br><br>

                <label for="Depeartment">Depeartment</label>
                <select id="Depeartment" name="Depeartment" required>
                    <option value="" disabled selected>--Select Department--</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Data Science">Data Science</option>
                    <option value="software engineering">software engineering</option>
                    <option value="cyber security">cyber security</option>
                    <option value="information system">information system</option>
                    <option value="information technology">information technology</option>
                    <option value="information communication technology">information communication technology</option>
                </select>
    

            </fieldset>


            <br><br>
           <button type="submit" >submit Registration</button>



        </form>

    </body>
</html>
